<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Tank body: sleek, modern design -->
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main hull: elongated hexagon pointing right -->
  <g filter="url(#shadow)">
    <path d="M 48 32 L 44 22 L 32 18 L 20 22 L 16 32 L 20 42 L 32 46 L 44 42 Z"
          fill="url(#bodyGradient)" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Tracks suggestion (side details) -->
    <rect x="14" y="22" width="3" height="20" rx="1.5" fill="#1a1a1a" opacity="0.6"/>
    <rect x="47" y="22" width="3" height="20" rx="1.5" fill="#1a1a1a" opacity="0.6"/>

    <!-- Front armor plates (sloped) -->
    <polygon points="48,32 50,30 50,34" fill="#1e40af" stroke="#0f2050" stroke-width="0.5"/>

    <!-- Highlight on hull -->
    <ellipse cx="32" cy="26" rx="8" ry="3" fill="white" opacity="0.2"/>
  </g>
</svg>
