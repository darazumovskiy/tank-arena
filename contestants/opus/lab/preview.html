<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#1e2126;display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding:24px;font-family:sans-serif;color:#ddd;width:900px}
.t{position:relative;flex:none}
.t img{position:absolute;left:0;top:0;width:100%;height:100%}
.sand{background:#cdbf9f;padding:10px}
.dark{background:#3a4048;padding:10px}
.cap{font-size:13px;color:#aaa}
</style></head><body>
<div><div class="t" style="width:360px;height:360px"><img src="../tank/body.svg"><img src="../tank/turret.svg" style="transform:rotate(-28deg)"></div><div class="cap">крупно (экран представления)</div></div>
<div class="sand"><div class="t" style="width:64px;height:64px"><img src="../tank/body.svg"><img src="../tank/turret.svg"></div></div>
<div class="sand"><div class="t" style="width:64px;height:64px;transform:rotate(145deg)"><img src="../tank/body.svg"><img src="../tank/turret.svg" style="transform:rotate(-120deg)"></div></div>
<div class="dark"><div class="t" style="width:64px;height:64px;transform:rotate(-60deg)"><img src="../tank/body.svg"><img src="../tank/turret.svg" style="transform:rotate(80deg)"></div></div>
<div class="dark"><div class="t" style="width:64px;height:64px"><img src="../tank/body.svg"><img src="../tank/turret.svg" style="transform:rotate(180deg)"></div></div>
</body></html>
